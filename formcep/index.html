<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
	<title>Formulário CEP</title>
</head>
<body>
	<div class="container">
		<form>
			<input type="text" id="cep" name="cep" placeholder="Digite o CEP" maxlength="8" autofocus>
			<input type="text" id="logradouro" name="logradouro" placeholder="Rua">
			<input type="text" id="bairro" name="bairro" placeholder="Bairro">
			<input type="text" id="localidade" name="localidade" placeholder="Cidade">
			<input type="text" id="uf" name="uf" placeholder="Estado">
			<button type="submit">Enviar</button>
		</form>
	</div>
</body>
</html>
